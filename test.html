<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Visual Test</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      background: linear-gradient(180deg, #f3f7fb 0%, #dbeafe 100%);
      color: #111827;
    }

    .wrap {
      max-width: 900px;
      margin: 40px auto;
      padding: 20px;
    }

    .hero {
      background: white;
      border-radius: 28px;
      padding: 32px;
      box-shadow: 0 20px 50px rgba(0,0,0,.12);
      border: 1px solid #dbe3ee;
    }

    .badge {
      display: inline-block;
      background: #dbeafe;
      color: #1d4ed8;
      font-weight: 700;
      font-size: 12px;
      padding: 8px 12px;
      border-radius: 999px;
      margin-bottom: 16px;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 42px;
      line-height: 1.1;
    }

    p {
      margin: 0;
      font-size: 16px;
      color: #475569;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 20px;
    }

    .card {
      background: white;
      border-radius: 22px;
      padding: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,.08);
      border: 1px solid #dbe3ee;
    }

    .label {
      font-size: 12px;
      color: #64748b;
      font-weight: 700;
      margin-bottom: 8px;
    }

    .value {
      font-size: 36px;
      font-weight: 800;
    }

    .btns {
      display: flex;
      gap: 12px;
      margin-top: 24px;
    }

    .btn {
      border: none;
      border-radius: 16px;
      padding: 14px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn.primary {
      background: #111827;
      color: white;
    }

    .btn.secondary {
      background: white;
      color: #111827;
      border: 1px solid #cbd5e1;
    }

    @media (max-width: 700px) {
      .grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 32px;
      }

      .btns {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="hero">
      <div class="badge">UI TEST</div>
      <h1>これがデザイン表示テストです</h1>
      <p>白いカード、青い背景、角丸、影が見えればHTML/CSSは正常です。</p>

      <div class="btns">
        <button class="btn primary">黒ボタン</button>
        <button class="btn secondary">白ボタン</button>
      </div>
    </div>

    <div class="grid">
      <div class="card">
        <div class="label">本日稼働中</div>
        <div class="value">8</div>
      </div>
      <div class="card">
        <div class="label">未退勤</div>
        <div class="value">2</div>
      </div>
      <div class="card">
        <div class="label">前払い合計</div>
        <div class="value">¥240K</div>
      </div>
    </div>
  </div>
</body>
</html>

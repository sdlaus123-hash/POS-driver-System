<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>出勤報告</title>

<style>
:root{
  --bg:#0a0b0f;
  --bg-2:#11131a;
  --panel:rgba(21,24,34,.72);
  --panel-strong:rgba(26,29,40,.92);
  --line:rgba(255,255,255,.08);
  --line-strong:rgba(255,255,255,.14);
  --text:#f5f7fb;
  --muted:#98a1b3;
  --accent:#ffd95c;
  --accent-2:#ffb800;
  --danger:#7f8799;
  --success:#22c55e;
  --shadow:0 24px 80px rgba(0,0,0,.45);
  --radius:28px;
  --radius-sm:18px;
  --blur:18px;
  --ease:cubic-bezier(.22,1,.36,1);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(255,217,92,.12), transparent 45%),
    radial-gradient(700px 400px at 100% 0%, rgba(69,104,220,.14), transparent 40%),
    linear-gradient(180deg, #0a0b0f 0%, #10131b 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
}

body{
  padding:
    max(14px, env(safe-area-inset-top))
    16px
    max(20px, env(safe-area-inset-bottom))
    16px;
}

.app{
  width:min(100%, 430px);
  margin:0 auto;
}

.hero{
  position:relative;
  overflow:hidden;
  padding:22px 20px 18px;
  border-radius:32px;
  background:
    linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
    linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.01));
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
}

.hero::before{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  right:-30px;
  top:-30px;
  background:radial-gradient(circle, rgba(255,217,92,.24), transparent 68%);
  pointer-events:none;
}

.kicker{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  color:var(--accent);
  font-size:12px;
  font-weight:700;
  letter-spacing:.04em;
}

.kicker-dot{
  width:8px;
  height:8px;
  border-radius:999px;
  background:var(--accent);
  box-shadow:0 0 12px rgba(255,217,92,.9);
}

.hero h1{
  margin:14px 0 8px;
  font-size:30px;
  line-height:1.08;
  letter-spacing:-.03em;
}

.hero p{
  margin:0;
  color:var(--muted);
  font-size:14px;
  line-height:1.65;
}

.main-card{
  margin-top:16px;
  padding:16px;
  border-radius:var(--radius);
  background:var(--panel);
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
}

.driver{
  display:flex;
  align-items:center;
  gap:14px;
  padding:14px;
  border-radius:22px;
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border:1px solid var(--line);
}

.avatar{
  width:54px;
  height:54px;
  border-radius:18px;
  display:grid;
  place-items:center;
  background:
    linear-gradient(135deg, rgba(255,217,92,.22), rgba(255,184,0,.06)),
    rgba(255,255,255,.03);
  border:1px solid rgba(255,217,92,.24);
  font-weight:800;
  color:var(--accent);
  flex:0 0 auto;
}

.driver-meta{
  min-width:0;
}

.driver-name{
  font-size:18px;
  font-weight:800;
  line-height:1.2;
  letter-spacing:-.02em;
}

.driver-site{
  margin-top:4px;
  font-size:13px;
  color:var(--muted);
}

.chips{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
  margin:14px 0 4px;
}

.chip{
  display:inline-flex;
  align-items:center;
  gap:7px;
  min-height:34px;
  padding:0 12px;
  border-radius:999px;
  background:rgba(255,255,255,.05);
  border:1px solid rgba(255,255,255,.08);
  font-size:12px;
  color:#dce2ee;
}

.chip-status-dot{
  width:8px;
  height:8px;
  border-radius:999px;
  background:#7f8799;
  box-shadow:0 0 0 0 rgba(127,135,153,.5);
  transition:all .35s var(--ease);
}

.chip-status-dot.working{
  background:var(--success);
  box-shadow:0 0 16px rgba(34,197,94,.55);
}

.info{
  margin-top:14px;
  padding:14px 14px 15px;
  border-radius:22px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
}

.info-label{
  font-size:12px;
  color:var(--muted);
  margin-bottom:6px;
}

.info-value{
  font-size:15px;
  line-height:1.7;
}

.actions{
  margin-top:16px;
  display:grid;
  gap:12px;
}

.btn{
  position:relative;
  overflow:hidden;
  width:100%;
  min-height:60px;
  border:none;
  border-radius:22px;
  padding:0 18px;
  font-size:17px;
  font-weight:800;
  letter-spacing:-.02em;
  transition:
    transform .22s var(--ease),
    box-shadow .22s var(--ease),
    opacity .18s ease,
    filter .18s ease;
  will-change:transform;
}

.btn:active{
  transform:scale(.985);
}

.btn[disabled]{
  opacity:.55;
  filter:saturate(.75);
}

.btn-main{
  color:#17120a;
  background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  box-shadow:0 16px 34px rgba(255,184,0,.28);
}

.btn-sub{
  color:var(--text);
  background:linear-gradient(180deg, rgba(255,255,255,.08), rgba(255,255,255,.04));
  border:1px solid var(--line-strong);
  box-shadow:0 14px 28px rgba(0,0,0,.24);
}

.btn::after{
  content:"";
  position:absolute;
  inset:-40%;
  background:linear-gradient(120deg, transparent 25%, rgba(255,255,255,.28) 50%, transparent 75%);
  transform:translateX(-120%) rotate(8deg);
}

.btn.btn-shine::after{
  animation:shine 1s var(--ease);
}

.note{
  margin-top:14px;
}

.note label{
  display:block;
  font-size:13px;
  color:var(--muted);
  margin-bottom:8px;
}

textarea{
  width:100%;
  min-height:100px;
  resize:none;
  border:none;
  outline:none;
  border-radius:20px;
  padding:16px;
  font-size:16px;
  line-height:1.55;
  color:var(--text);
  background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.04);
}

textarea::placeholder{
  color:#70798c;
}

.done-card{
  margin-top:16px;
  display:none;
  padding:20px 18px;
  border-radius:var(--radius);
  background:var(--panel-strong);
  border:1px solid rgba(34,197,94,.18);
  box-shadow:var(--shadow);
  text-align:center;
}

.done-icon{
  width:82px;
  height:82px;
  margin:0 auto 14px;
  border-radius:28px;
  display:grid;
  place-items:center;
  color:#04150a;
  font-size:34px;
  font-weight:900;
  background:radial-gradient(circle at 30% 30%, #5cf19b 0%, #22c55e 60%, #13954a 100%);
  box-shadow:
    0 18px 36px rgba(34,197,94,.28),
    inset 0 1px 0 rgba(255,255,255,.28);
}

.done-title{
  font-size:22px;
  font-weight:900;
  letter-spacing:-.03em;
}

.done-sub{
  margin-top:8px;
  color:var(--muted);
  line-height:1.7;
  font-size:14px;
}

.done-meta{
  margin-top:16px;
  padding:14px;
  border-radius:22px;
  background:rgba(255,255,255,.03);
  border:1px solid rgba(255,255,255,.06);
  text-align:left;
}

.done-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:10px 0;
  border-bottom:1px solid rgba(255,255,255,.06);
}

.done-row:last-child{
  border-bottom:none;
}

.done-key{
  color:var(--muted);
  font-size:13px;
}

.done-val{
  font-size:14px;
  font-weight:700;
  text-align:right;
}

.loading{
  position:fixed;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;
  background:rgba(4,6,10,.42);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  opacity:0;
  pointer-events:none;
  transition:opacity .22s ease;
  z-index:100;
}

.loading.show{
  opacity:1;
  pointer-events:auto;
}

.loading-box{
  width:170px;
  padding:18px 16px 16px;
  text-align:center;
  border-radius:24px;
  background:rgba(19,22,31,.85);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:var(--shadow);
}

.orbit{
  position:relative;
  width:42px;
  height:42px;
  margin:0 auto 12px;
}

.orbit::before,
.orbit::after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:999px;
  border:2px solid transparent;
}

.orbit::before{
  border-top-color:var(--accent);
  animation:spin 1s linear infinite;
}

.orbit::after{
  inset:8px;
  border-top-color:rgba(255,255,255,.8);
  animation:spinReverse .9s linear infinite;
}

.loading-title{
  font-size:14px;
  font-weight:800;
}

.loading-sub{
  margin-top:4px;
  color:var(--muted);
  font-size:12px;
}

.toast{
  position:fixed;
  left:50%;
  bottom:calc(20px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(16px) scale(.98);
  min-width:160px;
  max-width:calc(100vw - 32px);
  padding:13px 16px;
  border-radius:999px;
  background:rgba(14,17,24,.92);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 18px 36px rgba(0,0,0,.34);
  text-align:center;
  font-size:13px;
  font-weight:700;
  opacity:0;
  pointer-events:none;
  transition:
    opacity .2s ease,
    transform .24s var(--ease);
  z-index:110;
}

.toast.show{
  opacity:1;
  transform:translateX(-50%) translateY(0) scale(1);
}

.hidden{
  display:none !important;
}

.enter-up{
  animation:enterUp .7s var(--ease) both;
}

.enter-up-delay{
  animation:enterUp .85s var(--ease) both;
}

.fade-scale{
  animation:fadeScale .32s var(--ease) both;
}

.success-burst{
  animation:successBurst .6s var(--ease);
}

@keyframes enterUp{
  from{
    opacity:0;
    transform:translateY(18px) scale(.985);
  }
  to{
    opacity:1;
    transform:translateY(0) scale(1);
  }
}

@keyframes fadeScale{
  from{
    opacity:0;
    transform:scale(.96);
  }
  to{
    opacity:1;
    transform:scale(1);
  }
}

@keyframes successBurst{
  0%{ transform:scale(.88); }
  55%{ transform:scale(1.04); }
  100%{ transform:scale(1); }
}

@keyframes shine{
  to{
    transform:translateX(120%) rotate(8deg);
  }
}

@keyframes spin{
  to{ transform:rotate(360deg); }
}

@keyframes spinReverse{
  to{ transform:rotate(-360deg); }
}

@media (prefers-reduced-motion: reduce){
  *,
  *::before,
  *::after{
    animation:none !important;
    transition:none !important;
    scroll-behavior:auto !important;
  }
}
</style>
</head>
<body>

<div class="app">
  <section class="hero enter-up">
    <div class="kicker">
      <span class="kicker-dot"></span>
      勤務報告
    </div>
    <h1>今日の勤務を<br>ワンタップで完了</h1>
    <p>LINEから開いたあと、必要な操作だけを迷わず進められる設計です。</p>
  </section>

  <section class="main-card enter-up-delay" id="workCard">
    <div class="driver">
      <div class="avatar" id="avatarText">石</div>
      <div class="driver-meta">
        <div class="driver-name" id="driverName">石塚 歩汰</div>
        <div class="driver-site" id="driverSite">川口領家 Amazon</div>
      </div>
    </div>

    <div class="chips">
      <div class="chip" id="dateChip">--年--月--日</div>
      <div class="chip" id="statusChip">
        <span class="chip-status-dot" id="statusDot"></span>
        <span id="statusText">未出勤</span>
      </div>
    </div>

    <div class="info">
      <div class="info-label">現在の案内</div>
      <div class="info-value" id="guideText">
        本日はまだ出勤していません。勤務を開始する場合は下の出勤ボタンを押してください。
      </div>
    </div>

    <div class="note">
      <label for="note">備考（任意）</label>
      <textarea id="note" placeholder="例：今日は直行です / 遅延あり / 特記事項なし"></textarea>
    </div>

    <div class="actions">
      <button class="btn btn-main" id="startBtn" onclick="submitAttendance('start')">出勤する</button>
      <button class="btn btn-sub hidden" id="endBtn" onclick="submitAttendance('end')">退勤する</button>
    </div>
  </section>

  <section class="done-card" id="doneCard">
    <div class="done-icon success-burst">✓</div>
    <div class="done-title">退勤報告が完了しました</div>
    <div class="done-sub">本日の勤務報告は送信済みです。今日も一日お疲れさまでした。</div>

    <div class="done-meta">
      <div class="done-row">
        <div class="done-key">ドライバー</div>
        <div class="done-val" id="doneDriver">石塚 歩汰</div>
      </div>
      <div class="done-row">
        <div class="done-key">現場</div>
        <div class="done-val" id="doneSite">川口領家 Amazon</div>
      </div>
      <div class="done-row">
        <div class="done-key">出勤時刻</div>
        <div class="done-val" id="doneStart">-</div>
      </div>
      <div class="done-row">
        <div class="done-key">退勤時刻</div>
        <div class="done-val" id="doneEnd">-</div>
      </div>
    </div>
  </section>
</div>

<div class="loading" id="loading">
  <div class="loading-box">
    <div class="orbit"></div>
    <div class="loading-title" id="loadingTitle">処理中...</div>
    <div class="loading-sub" id="loadingSub">しばらくお待ちください</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/*
  LINEリッチメニュー「出勤」用ページ
  要件:
  - 初期表示は出勤ボタンのみ
  - 出勤後は退勤ボタンのみ表示
  - 退勤完了後は完了画面
  - 今はデモ用でローカル状態管理
  - API連携時は fetch 部分を差し替え
*/

const API_URL = ""; // 例: "https://script.google.com/macros/s/xxxxx/exec"
const USER_ID = "LINE_USER_ID_SAMPLE";

const state = {
  driverName: "石塚 歩汰",
  siteName: "川口領家 Amazon",
  status: "not_started", // not_started | working | finished
  startTime: "",
  endTime: "",
  note: ""
};

let isSubmitting = false;

const $ = (id) => document.getElementById(id);

function getWorkDate(){
  const now = new Date();
  if(now.getHours() < 4){
    now.setDate(now.getDate() - 1);
  }
  return now;
}

function formatDateJP(date){
  return new Intl.DateTimeFormat("ja-JP", {
    year: "numeric",
    month: "long",
    day: "numeric",
    weekday: "short"
  }).format(date);
}

function formatTime(date = new Date()){
  return new Intl.DateTimeFormat("ja-JP", {
    hour: "2-digit",
    minute: "2-digit"
  }).format(date);
}

function initialsFromName(name){
  return name ? name.trim().charAt(0) : "人";
}

function showLoading(title, sub){
  $("loadingTitle").textContent = title || "処理中...";
  $("loadingSub").textContent = sub || "しばらくお待ちください";
  $("loading").classList.add("show");
}

function hideLoading(){
  $("loading").classList.remove("show");
}

function showToast(message){
  const toast = $("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => {
    toast.classList.remove("show");
  }, 1800);
}

function triggerShine(button){
  button.classList.remove("btn-shine");
  void button.offsetWidth;
  button.classList.add("btn-shine");
}

function render(){
  $("avatarText").textContent = initialsFromName(state.driverName);
  $("driverName").textContent = state.driverName;
  $("driverSite").textContent = state.siteName;
  $("doneDriver").textContent = state.driverName;
  $("doneSite").textContent = state.siteName;
  $("dateChip").textContent = formatDateJP(getWorkDate());

  const statusText = $("statusText");
  const statusDot = $("statusDot");
  const guideText = $("guideText");
  const startBtn = $("startBtn");
  const endBtn = $("endBtn");
  const workCard = $("workCard");
  const doneCard = $("doneCard");

  if(state.status === "not_started"){
    statusText.textContent = "未出勤";
    statusDot.classList.remove("working");
    guideText.innerHTML = "本日はまだ出勤していません。勤務を開始する場合は下の出勤ボタンを押してください。";
    startBtn.classList.remove("hidden");
    endBtn.classList.add("hidden");
    workCard.style.display = "";
    doneCard.style.display = "none";
    return;
  }

  if(state.status === "working"){
    statusText.textContent = "出勤済み";
    statusDot.classList.add("working");
    guideText.innerHTML = `出勤時刻は <strong>${state.startTime || "-"}</strong> です。勤務が終了したら退勤ボタンを押してください。`;
    startBtn.classList.add("hidden");
    endBtn.classList.remove("hidden");
    workCard.style.display = "";
    doneCard.style.display = "none";
    return;
  }

  if(state.status === "finished"){
    workCard.style.display = "none";
    doneCard.style.display = "block";
    doneCard.classList.remove("fade-scale");
    void doneCard.offsetWidth;
    doneCard.classList.add("fade-scale");
    $("doneStart").textContent = state.startTime || "-";
    $("doneEnd").textContent = state.endTime || "-";
  }
}

async function saveAttendance(action, payload){
  if(!API_URL){
    await new Promise(resolve => setTimeout(resolve, 850));
    return { ok: true };
  }

  const response = await fetch(API_URL, {
    method: "POST",
    headers: {
      "Content-Type": "text/plain;charset=utf-8"
    },
    body: JSON.stringify({
      type: "attendance",
      action,
      userId: USER_ID,
      ...payload
    })
  });

  if(!response.ok){
    throw new Error("送信に失敗しました");
  }

  return await response.json().catch(() => ({ ok: true }));
}

async function submitAttendance(action){
  if(isSubmitting) return;

  const note = $("note").value.trim();
  const now = new Date();
  const time = formatTime(now);
  const workDate = getWorkDate().toISOString().slice(0, 10);

  const button = action === "start" ? $("startBtn") : $("endBtn");

  try{
    isSubmitting = true;
    button.disabled = true;
    triggerShine(button);

    showLoading(
      action === "start" ? "出勤を記録中..." : "退勤を記録中...",
      action === "start" ? "勤務開始情報を送信しています" : "勤務終了情報を送信しています"
    );

    await saveAttendance(action, {
      note,
      workDate,
      time
    });

    if(action === "start"){
      state.status = "working";
      state.startTime = time;
      state.note = note;
      render();
      showToast("出勤を記録しました");
    } else {
      state.status = "finished";
      state.endTime = time;
      state.note = note;
      render();
      showToast("退勤を記録しました");
    }
  } catch(error){
    showToast(error.message || "エラーが発生しました");
  } finally{
    isSubmitting = false;
    button.disabled = false;
    hideLoading();
  }
}

render();
requestAnimationFrame(() => {
  triggerShine($("startBtn"));
});
</script>

</body>
</html>

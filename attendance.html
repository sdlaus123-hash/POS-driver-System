<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>勤務報告</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background:#f6f4ee;
}

.wrap{
  max-width:420px;
  margin:auto;
  padding:16px;
}

.header{
  background:#111;
  color:#fff;
  padding:20px;
  border-radius:20px;
  margin-bottom:16px;
}

.card{
  background:#fff;
  border-radius:20px;
  padding:16px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  margin-top:12px;
  font-size:16px;
  font-weight:700;
}

.main{background:#111;color:#fff;}
.sub{background:#ffd95c;}

.hidden{display:none;}

.success{
  background:#eef8ef;
  padding:12px;
  border-radius:12px;
  margin-bottom:10px;
}

.loading{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.3);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#fff;
  font-size:18px;
}

</style>
</head>

<body>

<div class="wrap">

  <div class="header">
    <h2>勤務報告</h2>
    <div id="date"></div>
  </div>

  <!-- 入力 -->
  <div id="input" class="card">
    <div id="driverName">石塚 歩汰</div>
    <div id="driverSite">川口領家 Amazon</div>

    <textarea id="note" placeholder="備考"></textarea>

    <button id="startBtn" class="btn main" onclick="submit('start')">出勤する</button>
    <button id="endBtn" class="btn sub hidden" onclick="submit('end')">退勤する</button>
  </div>

  <!-- 完了 -->
  <div id="done" class="card hidden">
    <div class="success">完了しました</div>
    <div id="doneText"></div>
  </div>

</div>

<div id="loading" class="loading hidden">処理中...</div>

<script>

// ===== 5時切り替え =====
function getWorkDate(){
  const now = new Date();
  if(now.getHours() < 5){
    now.setDate(now.getDate() - 1);
  }
  return now;
}

function formatDate(){
  const d = getWorkDate();
  return `${d.getFullYear()}年${d.getMonth()+1}月${d.getDate()}日`;
}

// ===== 状態 =====
let status = 'not_started';
let startTime = '';
let endTime = '';

function init(){
  document.getElementById('date').innerText = formatDate();
}

function showLoading(v){
  document.getElementById('loading').classList.toggle('hidden', !v);
}

// ===== 送信 =====
async function submit(type){

  showLoading(true);

  await new Promise(r=>setTimeout(r,700));

  const now = new Date().toLocaleTimeString();

  if(type==='start'){
    status='started';
    startTime=now;
    document.getElementById('startBtn').classList.add('hidden');
    document.getElementById('endBtn').classList.remove('hidden');
  }

  if(type==='end'){
    status='finished';
    endTime=now;

    document.getElementById('input').classList.add('hidden');
    document.getElementById('done').classList.remove('hidden');

    document.getElementById('doneText').innerText =
      `出勤:${startTime} / 退勤:${endTime}`;
  }

  showLoading(false);
}

init();

</script>
</body>
</html>

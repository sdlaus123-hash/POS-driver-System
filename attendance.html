<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ドライバーアプリ</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#0e0f12;
  color:#fff;
}

.wrap{
  max-width:420px;
  margin:auto;
  padding:16px;
}

.tab{
  display:flex;
  gap:6px;
  margin-bottom:12px;
}

.tab button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  background:#222;
  color:#fff;
}

.tab .active{
  background:#ffd95c;
  color:#000;
}

.card{
  background:#17181c;
  padding:16px;
  border-radius:16px;
}

.btn{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-top:10px;
  font-weight:bold;
}

.main{background:#ffd95c;color:#000;}
.sub{background:#333;color:#fff;}

input,textarea{
  width:100%;
  padding:10px;
  margin-top:8px;
  border-radius:10px;
  border:none;
  background:#111;
  color:#fff;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="tab">
    <button class="active" onclick="showTab('work')">勤務</button>
    <button onclick="showTab('advance')">前払い</button>
    <button onclick="showTab('holiday')">休み</button>
  </div>

  <!-- 勤務 -->
  <div id="work" class="card">
    <h3>勤務報告</h3>
    <button class="btn main" onclick="send('start')">出勤</button>
    <button class="btn sub" onclick="send('end')">退勤</button>
  </div>

  <!-- 前払い -->
  <div id="advance" class="card" style="display:none;">
    <h3>前払い申請</h3>
    <input id="days" placeholder="何日分">
    <button class="btn main" onclick="advance()">申請</button>
  </div>

  <!-- 休み -->
  <div id="holiday" class="card" style="display:none;">
    <h3>休み希望</h3>
    <input type="date" id="holidayDate">
    <button class="btn main" onclick="holiday()">送信</button>
  </div>

</div>

<script>
const API = "YOUR_GAS_URL";
const USER_ID = "LINE_USER_ID";

/* タブ切替 */
function showTab(id){
  document.querySelectorAll(".card").forEach(e=>e.style.display="none");
  document.getElementById(id).style.display="block";

  document.querySelectorAll(".tab button").forEach(b=>b.classList.remove("active"));
  event.target.classList.add("active");
}

/* 勤務 */
function send(type){
  fetch(API,{
    method:"POST",
    body:JSON.stringify({
      type:"attendance",
      action:type,
      userId:USER_ID
    })
  });
  alert(type==="start"?"出勤しました":"退勤しました");
}

/* 前払い */
function advance(){
  const days = document.getElementById("days").value;

  fetch(API,{
    method:"POST",
    body:JSON.stringify({
      type:"advance",
      days:days,
      userId:USER_ID
    })
  });

  alert("申請しました");
}

/* 休み */
function holiday(){
  const date = document.getElementById("holidayDate").value;

  fetch(API,{
    method:"POST",
    body:JSON.stringify({
      type:"holiday",
      date:date,
      userId:USER_ID
    })
  });

  alert("送信しました");
}
</script>

</body>
</html>

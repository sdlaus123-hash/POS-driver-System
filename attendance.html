<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>勤務報告 | POMS</title>
  <link rel="stylesheet" href="styles.css?v=20260604-attendance120">
</head>
<body class="page-shell driver-page attendance-page" data-page="attendance">
  <main class="narrow driver-app attendance-app">
    <header class="mobile-topbar">
      <div class="brand-mark">P</div>
      <div>
        <strong>POMS</strong>
        <span>勤務報告</span>
      </div>
    </header>

    <section class="hero compact attendance-hero">
      <span class="eyebrow">Attendance</span>
      <h1>今日の勤務</h1>
      <p id="attendanceLead">3:00切替の業務日で保存します。</p>
    </section>

    <section class="demo-guide demo-only">
      <strong>ローカル確認モード</strong>
      <span>出勤、退勤、リセットを押すとデモデータで動作を確認できます。</span>
    </section>

    <section class="panel work-panel attendance-work-panel">
      <div class="person-card attendance-profile-card">
        <div class="avatar" id="driverInitial">P</div>
        <div>
          <strong id="driverName">読込中</strong>
          <span id="driverSite">現場を確認しています</span>
        </div>
      </div>

      <div class="status-strip attendance-status-card">
        <div>
          <span>勤務日</span>
          <strong id="workDateText">-</strong>
        </div>
        <div>
          <span>状態</span>
          <strong id="attendanceStatus">未出勤</strong>
        </div>
      </div>

      <div class="driver-command-card attendance-action-card" id="attendanceLiveCard">
        <div class="command-status"><span></span></div>
        <div>
          <strong id="attendanceActionTitle">今日の報告を始められます</strong>
          <p id="attendanceActionText">メモがなければ、そのまま下のバーを右へ動かしてください。</p>
        </div>
        <div class="attendance-time-row" id="attendanceTimeRow">
          <div>
            <span>出勤時刻</span>
            <strong id="attendanceStartTime">未記録</strong>
          </div>
          <div>
            <span>退勤時刻</span>
            <strong id="attendanceEndTime">未記録</strong>
          </div>
        </div>
      </div>

      <label class="field attendance-note-card">
        <span class="attendance-note-label"><strong>連絡事項</strong><small>任意・未入力OK</small></span>
        <textarea id="attendanceNote" placeholder="任意：遅延・車両トラブル・共有事項があれば入力"></textarea>
        <small class="field-help">必要な場合だけ入力してください。</small>
      </label>

      <div class="action-stack sticky-actions">
        <div class="sticky-action-head">
          <span id="attendanceNextActionLabel">次の操作</span>
          <strong id="attendanceActionHint">右へスワイプ</strong>
        </div>
        <div class="swipe-confirm primary" id="startWorkSwipe" role="button" tabindex="0" aria-disabled="false">
          <span class="swipe-fill"></span>
          <span class="swipe-copy"><strong>出勤を記録</strong><small data-swipe-detail>右へスワイプして出勤</small></span>
          <span class="swipe-thumb">→</span>
        </div>
        <div class="swipe-confirm success hidden" id="endWorkSwipe" role="button" tabindex="0" aria-disabled="false">
          <span class="swipe-fill"></span>
          <span class="swipe-copy"><strong>退勤を記録</strong><small data-swipe-detail>右へスワイプして退勤</small></span>
          <span class="swipe-thumb">→</span>
        </div>
        <button class="button primary hidden" id="startWorkBtn">出勤する</button>
        <button class="button success hidden" id="endWorkBtn">退勤する</button>
        <button class="button ghost demo-only" id="resetDemoBtn">今日の入力をリセット</button>
      </div>
    </section>

    <section class="panel success-panel hidden" id="attendanceDone">
      <div class="success-sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="done-mark">✓</div>
      <h2>勤務報告を保存しました</h2>
      <p id="doneAttendanceText">保存内容を確認しています。</p>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <div class="loading" id="loading"><div>処理中...</div></div>
  <script src="config.js?v=20260603-120"></script>
  <script src="app.js?v=20260604-attendance120"></script>
</body>
</html>

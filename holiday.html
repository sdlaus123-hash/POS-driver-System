<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>休み希望 | POMS</title>
  <link rel="stylesheet" href="styles.css?v=20260801-v21">
</head>
<body class="page-shell driver-page holiday-page" data-page="holiday">
  <main class="narrow driver-app">
    <header class="mobile-topbar">
      <div class="brand-mark">P</div>
      <div>
        <strong>POMS</strong>
        <span>休み希望</span>
      </div>
    </header>

    <section class="hero compact holiday">
      <span class="eyebrow">Holiday</span>
      <h1 id="holidayTitle">対象月を確認中</h1>
      <p id="holidayRuleText">日付を選び、最後にスワイプで送信します。</p>
    </section>

    <section class="demo-guide demo-only">
      <strong>ローカル確認モード</strong>
      <span>選択した日付は管理画面の管理メニューに反映されます。</span>
    </section>

    <section class="panel" id="holidayForm">
      <div class="person-card">
        <div class="avatar" id="driverInitial">P</div>
        <div>
          <strong id="driverName">読込中</strong>
          <span id="driverSite">現場を確認しています</span>
        </div>
      </div>

      <div class="calendar-head">
        <div>
          <strong id="calendarMonth">-</strong>
          <span>希望日をタップしてください</span>
        </div>
        <b id="holidayCountText">0日</b>
      </div>
      <div class="weekday-grid">
        <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
      </div>
      <div class="calendar-grid" id="holidayCalendar"></div>

      <label class="field">
        <span>メモ</span>
        <textarea id="holidayNote" placeholder="例: 家庭都合のため"></textarea>
      </label>

      <div class="selected-box">
        <span>選択中</span>
        <strong id="selectedHolidayText">未選択</strong>
      </div>

      <div class="button-row">
        <button class="button ghost wide-action" id="clearHolidayBtn">選択をリセット</button>
        <button class="button primary hidden" id="submitHolidayBtn">休み希望を送信</button>
      </div>
      <div class="swipe-confirm primary disabled" id="submitHolidaySwipe" role="button" tabindex="0" aria-disabled="true">
        <span class="swipe-fill"></span>
        <span class="swipe-copy"><strong>休み希望を送信</strong><small data-swipe-detail>日付を選ぶとスワイプできます</small></span>
        <span class="swipe-thumb">→</span>
      </div>
    </section>

    <section class="panel success-panel hidden" id="holidayReview">
      <div class="success-sparkles" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <div class="done-mark">✓</div>
      <h2>休み希望を保存しました</h2>
      <p id="holidayReviewText">保存内容を確認しています。</p>
      <button class="button primary" id="editHolidayBtn">内容を変更する</button>
    </section>
  </main>
  <div class="toast" id="toast"></div>
  <div class="loading" id="loading"><div>処理中...</div></div>
  <script src="config.js?v=20260801-v21"></script>
  <script src="app.js?v=20260801-v21"></script>
</body>
</html>

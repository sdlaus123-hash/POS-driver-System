<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>休み希望</title>

<style>
:root{
  --bg:#0a0b0f;
  --bg-2:#11131a;
  --panel:rgba(21,24,34,.72);
  --panel-strong:rgba(26,29,40,.92);
  --line:rgba(255,255,255,.08);
  --text:#f5f7fb;
  --muted:#98a1b3;
  --accent:#ffd95c;
  --accent-2:#ffb800;
  --success:#22c55e;
  --shadow:0 24px 80px rgba(0,0,0,.45);
  --radius:28px;
  --blur:18px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{
  margin:0;min-height:100%;
  background:
    radial-gradient(1200px 600px at 50% -10%, rgba(255,217,92,.10), transparent 45%),
    radial-gradient(700px 400px at 100% 0%, rgba(69,104,220,.12), transparent 40%),
    linear-gradient(180deg, #0a0b0f 0%, #10131b 100%);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",sans-serif;
}
body{
  padding:max(14px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom)) 16px;
}
.app{width:min(100%, 430px);margin:0 auto;}
.hero,.card,.done-card{
  border:1px solid var(--line);
  box-shadow:var(--shadow);
  backdrop-filter:blur(var(--blur));
  -webkit-backdrop-filter:blur(var(--blur));
}
.hero{
  position:relative;overflow:hidden;padding:22px 20px 18px;border-radius:32px;
  background:linear-gradient(135deg, rgba(255,255,255,.06), rgba(255,255,255,.02));
}
.hero::before{
  content:"";position:absolute;width:180px;height:180px;right:-30px;top:-30px;
  background:radial-gradient(circle, rgba(255,217,92,.24), transparent 68%);
}
.kicker{
  display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);
  color:var(--accent);font-size:12px;font-weight:700;
}
.kicker-dot{width:8px;height:8px;border-radius:999px;background:var(--accent);}
.hero h1{margin:14px 0 8px;font-size:30px;line-height:1.08;letter-spacing:-.03em;}
.hero p{margin:0;color:var(--muted);font-size:14px;line-height:1.65;}
.card{
  margin-top:16px;padding:16px;border-radius:28px;background:var(--panel);
}
.driver{
  display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;
  background:linear-gradient(180deg, rgba(255,255,255,.04), rgba(255,255,255,.02));
  border:1px solid var(--line);
}
.avatar{
  width:54px;height:54px;border-radius:18px;display:grid;place-items:center;
  background:linear-gradient(135deg, rgba(255,217,92,.22), rgba(255,184,0,.06));
  border:1px solid rgba(255,217,92,.24);font-weight:800;color:var(--accent);
}
.driver-name{font-size:18px;font-weight:800;line-height:1.2;letter-spacing:-.02em;}
.driver-site{margin-top:4px;font-size:13px;color:var(--muted);}
.section{margin-top:16px;}
.label{font-size:13px;color:var(--muted);margin-bottom:8px;}
.input,.textarea{
  width:100%;border:none;outline:none;border-radius:20px;padding:16px;
  font-size:16px;color:var(--text);background:rgba(255,255,255,.04);
  border:1px solid rgba(255,255,255,.08);
}
.textarea{min-height:110px;resize:none;}
.selected-days{
  margin-top:14px;padding:14px;border-radius:22px;
  background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.06);
}
.days-list{
  display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;
}
.day-chip{
  display:inline-flex;align-items:center;gap:8px;padding:10px 12px;border-radius:999px;
  background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:13px;
}
.day-chip button{
  border:none;background:none;color:#ffb4b4;font-size:14px;font-weight:800;padding:0;
}
.btn-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px;}
.btn{
  position:relative;overflow:hidden;width:100%;min-height:58px;border:none;border-radius:22px;
  padding:0 18px;font-size:16px;font-weight:800;letter-spacing:-.02em;
}
.btn-main{
  color:#17120a;background:linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
  box-shadow:0 16px 34px rgba(255,184,0,.28);
}
.btn-sub{
  color:var(--text);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);
}
.btn::after{
  content:"";position:absolute;inset:-40%;
  background:linear-gradient(120deg, transparent 25%, rgba(255,255,255,.28) 50%, transparent 75%);
  transform:translateX(-120%) rotate(8deg);
}
.btn.btn-shine::after{animation:shine 1s var(--ease);}
.done-card{
  display:none;margin-top:16px;padding:20px 18px;border-radius:28px;
  background:var(--panel-strong);text-align:center;
}
.done-icon{
  width:82px;height:82px;margin:0 auto 14px;border-radius:28px;display:grid;place-items:center;
  color:#04150a;font-size:34px;font-weight:900;
  background:radial-gradient(circle at 30% 30%, #5cf19b 0%, #22c55e 60%, #13954a 100%);
}
.done-title{font-size:22px;font-weight:900;letter-spacing:-.03em;}
.done-sub{margin-top:8px;color:var(--muted);line-height:1.7;font-size:14px;}
.loading{
  position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(4,6,10,.42);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity .22s ease;z-index:100;
}
.loading.show{opacity:1;pointer-events:auto;}
.loading-box{
  width:170px;padding:18px 16px 16px;text-align:center;border-radius:24px;
  background:rgba(19,22,31,.85);border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);
}
.orbit{position:relative;width:42px;height:42px;margin:0 auto 12px;}
.orbit::before,.orbit::after{
  content:"";position:absolute;inset:0;border-radius:999px;border:2px solid transparent;
}
.orbit::before{border-top-color:var(--accent);animation:spin 1s linear infinite;}
.orbit::after{inset:8px;border-top-color:rgba(255,255,255,.8);animation:spinReverse .9s linear infinite;}
.loading-title{font-size:14px;font-weight:800;}
.loading-sub{margin-top:4px;color:var(--muted);font-size:12px;}
.toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(16px) scale(.98);
  min-width:160px;max-width:calc(100vw - 32px);padding:13px 16px;border-radius:999px;
  background:rgba(14,17,24,.92);border:1px solid rgba(255,255,255,.08);
  box-shadow:0 18px 36px rgba(0,0,0,.34);text-align:center;font-size:13px;font-weight:700;
  opacity:0;pointer-events:none;transition:opacity .2s ease, transform .24s var(--ease);z-index:110;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1);}
.enter-up{animation:enterUp .7s var(--ease) both;}
.enter-up-delay{animation:enterUp .85s var(--ease) both;}
.hidden{display:none!important;}
@keyframes enterUp{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes shine{to{transform:translateX(120%) rotate(8deg)}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes spinReverse{to{transform:rotate(-360deg)}}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;}
}
</style>
</head>
<body>
<div class="app">
  <section class="hero enter-up">
    <div class="kicker"><span class="kicker-dot"></span>休み希望</div>
    <h1>希望日を選んで<br>すぐ送信できます</h1>
    <p>記録専用なので構造はシンプルです。必要な日付だけ登録できます。</p>
  </section>

  <section class="card enter-up-delay" id="formCard">
    <div class="driver">
      <div class="avatar" id="avatarText">石</div>
      <div>
        <div class="driver-name" id="driverName">石塚 歩汰</div>
        <div class="driver-site" id="driverSite">川口領家 Amazon</div>
      </div>
    </div>

    <div class="section">
      <div class="label">休み希望日</div>
      <input class="input" type="date" id="holidayDate">
    </div>

    <div class="btn-row">
      <button class="btn btn-sub" onclick="addHoliday()">追加する</button>
      <button class="btn btn-main" id="submitBtn" onclick="submitHoliday()">送信する</button>
    </div>

    <div class="section">
      <div class="label">備考（任意）</div>
      <textarea class="textarea" id="note" placeholder="例：私用のため"></textarea>
    </div>

    <div class="selected-days">
      <div class="label" style="margin-bottom:0;">選択中の休み希望</div>
      <div class="days-list" id="daysList"></div>
    </div>
  </section>

  <section class="done-card" id="doneCard">
    <div class="done-icon">✓</div>
    <div class="done-title">休み希望を送信しました</div>
    <div class="done-sub">選択した希望日は正常に記録されました。</div>
  </section>
</div>

<div class="loading" id="loading">
  <div class="loading-box">
    <div class="orbit"></div>
    <div class="loading-title" id="loadingTitle">送信中...</div>
    <div class="loading-sub" id="loadingSub">しばらくお待ちください</div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = "";
const USER_ID = "LINE_USER_ID_SAMPLE";

const state = {
  driverName: "石塚 歩汰",
  siteName: "川口領家 Amazon",
  holidays: []
};

const $ = (id) => document.getElementById(id);

function initialsFromName(name){
  return name ? name.trim().charAt(0) : "人";
}

function getBusinessDate(){
  const now = new Date();
  if(now.getHours() < 3){
    now.setDate(now.getDate() - 1);
  }
  return now;
}

function formatISODate(date){
  const y = date.getFullYear();
  const m = String(date.getMonth()+1).padStart(2,"0");
  const d = String(date.getDate()).padStart(2,"0");
  return `${y}-${m}-${d}`;
}

function showLoading(title, sub){
  $("loadingTitle").textContent = title || "送信中...";
  $("loadingSub").textContent = sub || "しばらくお待ちください";
  $("loading").classList.add("show");
}

function hideLoading(){
  $("loading").classList.remove("show");
}

function showToast(message){
  const toast = $("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => toast.classList.remove("show"), 1800);
}

function triggerShine(button){
  button.classList.remove("btn-shine");
  void button.offsetWidth;
  button.classList.add("btn-shine");
}

function renderHolidayList(){
  const list = $("daysList");
  list.innerHTML = "";

  if(state.holidays.length === 0){
    list.innerHTML = `<div style="color:var(--muted);font-size:13px;">まだ追加されていません</div>`;
    return;
  }

  state.holidays.forEach((date, index) => {
    const chip = document.createElement("div");
    chip.className = "day-chip";
    chip.innerHTML = `
      <span>${date}</span>
      <button type="button" onclick="removeHoliday(${index})">×</button>
    `;
    list.appendChild(chip);
  });
}

function addHoliday(){
  const value = $("holidayDate").value;
  if(!value){
    showToast("日付を選択してください");
    return;
  }
  if(state.holidays.includes(value)){
    showToast("その日付は追加済みです");
    return;
  }
  state.holidays.push(value);
  state.holidays.sort();
  $("holidayDate").value = "";
  renderHolidayList();
  showToast("追加しました");
}

function removeHoliday(index){
  state.holidays.splice(index, 1);
  renderHolidayList();
}

async function saveHoliday(payload){
  if(!API_URL){
    await new Promise(resolve => setTimeout(resolve, 900));
    return { ok:true };
  }

  const response = await fetch(API_URL, {
    method:"POST",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body:JSON.stringify({
      type:"holiday",
      userId:USER_ID,
      ...payload
    })
  });

  if(!response.ok){
    throw new Error("送信に失敗しました");
  }

  return await response.json().catch(() => ({ ok:true }));
}

async function submitHoliday(){
  if(state.holidays.length === 0){
    showToast("休み希望日を追加してください");
    return;
  }

  const btn = $("submitBtn");
  const note = $("note").value.trim();

  try{
    btn.disabled = true;
    triggerShine(btn);
    showLoading("休み希望を送信中...", "日付情報を記録しています");

    await saveHoliday({
      holidays: state.holidays,
      note,
      businessDate: formatISODate(getBusinessDate())
    });

    $("formCard").classList.add("hidden");
    $("doneCard").style.display = "block";
    showToast("休み希望を送信しました");
  } catch(error){
    showToast(error.message || "エラーが発生しました");
  } finally{
    btn.disabled = false;
    hideLoading();
  }
}

function init(){
  $("avatarText").textContent = initialsFromName(state.driverName);
  $("driverName").textContent = state.driverName;
  $("driverSite").textContent = state.siteName;

  const minDate = formatISODate(getBusinessDate());
  $("holidayDate").min = minDate;

  renderHolidayList();
  triggerShine($("submitBtn"));
}

init();
</script>
</body>
</html>

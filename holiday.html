<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>休み希望</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#0e0f12;
  color:#fff;
}

.wrap{
  max-width:420px;
  margin:auto;
  padding:16px;
}

/* ヘッダー */
.header{
  font-size:22px;
  font-weight:bold;
  margin-bottom:10px;
}

/* カレンダー */
.calendar{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:6px;
}

.day{
  padding:14px 0;
  text-align:center;
  border-radius:12px;
  background:#1a1c22;
  cursor:pointer;
  transition:.2s;
}

.day:hover{
  background:#222;
}

.day.selected{
  background:#ffd95c;
  color:#000;
  font-weight:bold;
}

.day.today{
  border:1px solid #ffd95c;
}

/* ボタン */
.btn{
  margin-top:16px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  font-weight:bold;
  background:#ffd95c;
  color:#000;
}

/* 選択リスト */
.selected-list{
  margin-top:10px;
  font-size:14px;
  color:#aaa;
}
</style>
</head>

<body>

<div class="wrap">

  <div class="header">休み希望</div>

  <div id="calendar" class="calendar"></div>

  <div class="selected-list" id="selectedList">
    未選択
  </div>

  <button class="btn" onclick="submit()">送信する</button>

</div>

<script>
const selected = [];
const today = new Date();

/* カレンダー生成 */
function generateCalendar(){
  const cal = document.getElementById("calendar");
  cal.innerHTML = "";

  const year = today.getFullYear();
  const month = today.getMonth();

  const lastDay = new Date(year, month+1, 0).getDate();

  for(let i=1;i<=lastDay;i++){
    const div = document.createElement("div");
    div.className="day";
    div.innerText=i;

    if(i === today.getDate()){
      div.classList.add("today");
    }

    div.onclick = ()=>{
      toggleDate(i, div);
    };

    cal.appendChild(div);
  }
}

/* 選択 */
function toggleDate(day, el){
  const key = day;

  if(selected.includes(key)){
    selected.splice(selected.indexOf(key),1);
    el.classList.remove("selected");
  }else{
    selected.push(key);
    el.classList.add("selected");
  }

  renderList();
}

/* 表示 */
function renderList(){
  const list = document.getElementById("selectedList");

  if(selected.length === 0){
    list.innerText="未選択";
    return;
  }

  list.innerText = "選択: " + selected.join(", ");
}

/* 送信 */
function submit(){
  if(selected.length === 0){
    alert("選択してください");
    return;
  }

  fetch("YOUR_GAS_URL",{
    method:"POST",
    body:JSON.stringify({
      type:"holiday",
      dates:selected
    })
  });

  alert("送信しました");
}

generateCalendar();
</script>

</body>
</html>

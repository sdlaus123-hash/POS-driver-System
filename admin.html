<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>POMS Pro Dashboard</title>

<style>
:root{
  --bg:#f6f8ff;
  --card:#ffffff;
  --text:#0f172a;
  --sub:#64748b;
  --blue:#2563eb;
  --violet:#7c3aed;
  --green:#16a34a;
  --orange:#f59e0b;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont;
  background:linear-gradient(180deg,#f6f8ff,#eef2ff);
  color:var(--text);
}

.container{
  max-width:1200px;
  margin:auto;
  padding:20px;
}

.header{
  font-size:28px;
  font-weight:900;
  margin-bottom:20px;
}

/* KPI */
.kpi{
  display:flex;
  gap:12px;
  overflow-x:auto;
  margin-bottom:20px;
}

.kpi-card{
  min-width:180px;
  padding:18px;
  border-radius:18px;
  color:#fff;
  font-weight:700;
}

.kpi-blue{background:linear-gradient(135deg,#2563eb,#1e40af)}
.kpi-violet{background:linear-gradient(135deg,#7c3aed,#4c1d95)}
.kpi-orange{background:linear-gradient(135deg,#f59e0b,#c2410c)}
.kpi-green{background:linear-gradient(135deg,#16a34a,#065f46)}

.kpi-value{font-size:32px;font-weight:900;margin-top:8px}

/* GRID */
.grid{
  display:grid;
  gap:16px;
}

@media(min-width:900px){
  .grid{grid-template-columns:2fr 1fr}
}

.card{
  background:var(--card);
  border-radius:20px;
  padding:18px;
  box-shadow:0 10px 25px rgba(0,0,0,.05);
}

.section-title{
  font-weight:800;
  margin-bottom:12px;
}

/* SITE */
.site{
  padding:16px;
  border-radius:16px;
  background:#f8fafc;
  display:flex;
  justify-content:space-between;
  margin-bottom:10px;
}

.site strong{font-size:22px}

/* DRIVER */
.driver{
  padding:14px;
  border-radius:14px;
  background:#f8fafc;
  margin-bottom:10px;
}

.driver-top{
  display:flex;
  justify-content:space-between;
}

.status{
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
}
.ok{background:#dcfce7}
.warn{background:#fef3c7}
.off{background:#e0e7ff}

/* ACTION */
.alert{
  padding:14px;
  border-radius:14px;
  margin-bottom:10px;
  background:#fff7ed;
}

/* BUTTON */
.btn{
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:10px;
  background:black;
  color:white;
  width:100%;
}

</style>
</head>

<body>
<div class="container">

<div class="header">管理ダッシュボード</div>

<div class="kpi">
  <div class="kpi-card kpi-blue">稼働中<div class="kpi-value">8</div></div>
  <div class="kpi-card kpi-violet">未退勤<div class="kpi-value">2</div></div>
  <div class="kpi-card kpi-orange">前払い<div class="kpi-value">¥240K</div></div>
  <div class="kpi-card kpi-green">稼働率<div class="kpi-value">87%</div></div>
</div>

<div class="grid">

<div>

<div class="card">
<div class="section-title">現場</div>

<div class="site">川口 Amazon <strong>5</strong></div>
<div class="site">新宿 Amazon <strong>3</strong></div>

</div>

<div class="card">
<div class="section-title">ドライバー</div>

<div class="driver">
<div class="driver-top">石塚 <span class="status ok">稼働中</span></div>
<button class="btn">詳細</button>
</div>

<div class="driver">
<div class="driver-top">田中 <span class="status warn">未退勤</span></div>
<button class="btn">修正</button>
</div>

<div class="driver">
<div class="driver-top">佐藤 <span class="status off">休み</span></div>
<button class="btn">詳細</button>
</div>

</div>

</div>

<div>

<div class="card">
<div class="section-title">重要</div>

<div class="alert">未退勤 2人</div>
<div class="alert">前払い増加</div>

</div>

<div class="card">
<div class="section-title">前払い</div>

<div class="driver">石塚 ¥120K</div>
<div class="driver">田中 ¥40K</div>

</div>

</div>

</div>

</div>
</body>
</html>

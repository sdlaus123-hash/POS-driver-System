<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POMS 管理画面</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont;
  background:#f5f7fb;
}

/* コンテナ */
.container{
  max-width:1100px;
  margin:auto;
  padding:16px;
}

/* タイトル */
.title{
  font-size:24px;
  font-weight:800;
  margin-bottom:16px;
}

/* KPI */
.kpi{
  display:flex;
  gap:12px;
  overflow-x:auto;
  margin-bottom:20px;
}
.kpi-card{
  min-width:140px;
  background:#fff;
  padding:16px;
  border-radius:16px;
  box-shadow:0 6px 16px rgba(0,0,0,.08);
}
.kpi-card strong{
  font-size:24px;
}

/* セクション */
.section{
  margin-bottom:24px;
}
.section-title{
  font-weight:700;
  margin-bottom:10px;
}

/* 現場 */
.site{
  background:#fff;
  border-radius:14px;
  padding:14px;
  margin-bottom:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 4px 12px rgba(0,0,0,.06);
}

/* ドライバー */
.driver{
  background:#fff;
  padding:12px;
  border-radius:12px;
  margin-bottom:8px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 4px 10px rgba(0,0,0,.05);
}

.status{
  font-size:12px;
  padding:4px 10px;
  border-radius:999px;
}
.ok{background:#dcfce7}
.warn{background:#fef3c7}
.off{background:#e0e7ff}

/* PC用2カラム */
@media(min-width:900px){
  .grid{
    display:grid;
    grid-template-columns:2fr 1fr;
    gap:20px;
  }
}
</style>
</head>

<body>

<div class="container">

<div class="title">管理ダッシュボード</div>

<!-- KPI -->
<div class="kpi">
  <div class="kpi-card"><div>稼働中</div><strong>8</strong></div>
  <div class="kpi-card"><div>未退勤</div><strong>2</strong></div>
  <div class="kpi-card"><div>前払い</div><strong>¥240K</strong></div>
</div>

<div class="grid">

<!-- 左側 -->
<div>

  <!-- 現場 -->
  <div class="section">
    <div class="section-title">現場</div>

    <div class="site">
      <div>川口Amazon</div>
      <strong>5人</strong>
    </div>

    <div class="site">
      <div>新宿Amazon</div>
      <strong>3人</strong>
    </div>
  </div>

  <!-- ドライバー -->
  <div class="section">
    <div class="section-title">ドライバー</div>

    <div class="driver">
      <div>石塚</div>
      <div class="status ok">稼働中</div>
    </div>

    <div class="driver">
      <div>田中</div>
      <div class="status warn">未退勤</div>
    </div>

    <div class="driver">
      <div>佐藤</div>
      <div class="status off">休み</div>
    </div>

  </div>

</div>

<!-- 右側 -->
<div>

  <div class="section">
    <div class="section-title">重要</div>

    <div class="driver">未退勤 2人</div>
    <div class="driver">前払い増加中</div>

  </div>

</div>

</div>

</div>

</body>
</html>

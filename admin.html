<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>POMS Minimal UI</title>

<style>
:root{
  --bg:#f8fafc;
  --card:#ffffff;
  --text:#0f172a;
  --sub:#64748b;
  --accent:#22c55e;
  --accent2:#3b82f6;
}

*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont;
  background:var(--bg);
  color:var(--text);
}

.container{
  max-width:480px;
  margin:auto;
  padding:20px;
}

h1{
  font-size:26px;
  font-weight:900;
  margin-bottom:20px;
}

.card{
  background:var(--card);
  border-radius:20px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 8px 20px rgba(0,0,0,.06);
  transition:.2s;
}

.card:hover{
  transform:translateY(-2px);
}

.big{
  font-size:36px;
  font-weight:900;
}

.label{
  color:var(--sub);
  font-size:14px;
}

.button{
  margin-top:14px;
  width:100%;
  padding:14px;
  border:none;
  border-radius:14px;
  font-weight:800;
  font-size:14px;
  background:linear-gradient(135deg,#22c55e,#16a34a);
  color:#fff;
}

.site{
  display:flex;
  justify-content:space-between;
  font-size:18px;
  font-weight:700;
}

.driver{
  display:flex;
  justify-content:space-between;
  margin-top:10px;
}

.badge{
  padding:4px 10px;
  border-radius:999px;
  font-size:12px;
}

.ok{background:#dcfce7}
.warn{background:#fef3c7}
.off{background:#e0e7ff}

.fade-in{
  animation:fade .4s ease;
}

@keyframes fade{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:translateY(0)}
}

</style>
</head>

<body>
<div class="container">

<h1>今日の状況</h1>

<div class="card fade-in">
  <div class="label">稼働中</div>
  <div class="big">8人</div>
</div>

<div class="card fade-in">
  <div class="label">未退勤</div>
  <div class="big">2人</div>
  <button class="button">確認する</button>
</div>

<div class="card fade-in">
  <div class="label">現場</div>
  <div class="site">川口 <span>5人</span></div>
  <div class="site">新宿 <span>3人</span></div>
</div>

<div class="card fade-in">
  <div class="label">ドライバー</div>

  <div class="driver">石塚 <span class="badge ok">稼働中</span></div>
  <div class="driver">田中 <span class="badge warn">未退勤</span></div>
  <div class="driver">佐藤 <span class="badge off">休み</span></div>

</div>

</div>
</body>
</html>

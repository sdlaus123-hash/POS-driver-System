<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POMS 管理画面</title>

<style>
body{
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
  background:linear-gradient(180deg,#f3f7fb,#e0ecff);
}

/* ヘッダー */
.header{
  padding:20px;
  font-size:22px;
  font-weight:800;
}

/* KPIカード */
.kpi{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:0 16px 16px;
}
.kpi-card{
  min-width:160px;
  background:#fff;
  padding:16px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.1);
}
.kpi-title{
  font-size:12px;
  color:#666;
}
.kpi-value{
  font-size:28px;
  font-weight:800;
}

/* セクション */
.section{
  padding:16px;
}
.title{
  font-size:18px;
  font-weight:700;
  margin-bottom:12px;
}

/* 現場カード */
.site{
  background:#fff;
  border-radius:20px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  cursor:pointer;
}
.site-name{
  font-weight:700;
}
.site-count{
  font-size:26px;
  font-weight:800;
}

/* ドライバー */
.driver{
  background:#fff;
  padding:14px;
  border-radius:16px;
  margin-bottom:10px;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.status{
  font-size:12px;
  padding:6px 10px;
  border-radius:999px;
}
.ok{background:#dcfce7;color:#166534;}
.warn{background:#fef3c7;color:#92400e;}
.off{background:#e0e7ff;color:#3730a3;}

button{
  border:none;
  padding:10px 14px;
  border-radius:12px;
  background:#111;
  color:#fff;
  font-weight:600;
}
</style>
</head>

<body>

<div class="header">
  管理ダッシュボード
</div>

<div class="kpi">
  <div class="kpi-card">
    <div class="kpi-title">稼働中</div>
    <div class="kpi-value">8</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-title">未退勤</div>
    <div class="kpi-value">2</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-title">前払い</div>
    <div class="kpi-value">¥240K</div>
  </div>
</div>

<div class="section">
  <div class="title">現場</div>

  <div class="site" onclick="selectSite('川口')">
    <div class="site-name">川口Amazon</div>
    <div class="site-count">5人</div>
  </div>

  <div class="site" onclick="selectSite('新宿')">
    <div class="site-name">新宿Amazon</div>
    <div class="site-count">3人</div>
  </div>
</div>

<div class="section">
  <div class="title" id="siteTitle">ドライバー</div>
  <div id="driverList"></div>
</div>

<script>
const data = {
  川口:[
    {name:"石塚",status:"ok"},
    {name:"田中",status:"warn"},
    {name:"佐藤",status:"off"}
  ],
  新宿:[
    {name:"小林",status:"ok"},
    {name:"鈴木",status:"warn"}
  ]
}

function selectSite(site){
  document.getElementById("siteTitle").innerText = site + " のドライバー"

  const list = document.getElementById("driverList")
  list.innerHTML = ""

  data[site].forEach(d=>{
    const el = document.createElement("div")
    el.className = "driver"

    el.innerHTML = `
      <div>${d.name}</div>
      <div class="status ${d.status}">
        ${d.status==="ok"?"稼働中":d.status==="warn"?"未退勤":"休み"}
      </div>
    `
    list.appendChild(el)
  })
}
</script>

</body>
</html>

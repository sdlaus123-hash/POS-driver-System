<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>POMS 管理画面</title>

<style>
:root{
  --bg:#f3f7fb;
  --panel:#ffffff;
  --text:#111111;
  --muted:#666666;
  --shadow:0 10px 25px rgba(0,0,0,.10);
  --radius:20px;
  --ease:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html{
  min-height:100%;
}
body{
  min-height:100vh;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;
  background-color:#e0ecff;
  background-image:linear-gradient(180deg,#f3f7fb 0%,#e0ecff 100%);
  color:var(--text);
  padding:0 0 40px;
}

/* ヘッダー */
.header{
  padding:20px 16px;
  font-size:22px;
  font-weight:800;
  color:#111;
}

/* KPIカード */
.kpi{
  display:flex;
  gap:12px;
  overflow-x:auto;
  padding:0 16px 16px;
  -webkit-overflow-scrolling:touch;
}
.kpi-card{
  flex-shrink:0;
  min-width:140px;
  background:#ffffff;
  padding:16px;
  border-radius:20px;
  box-shadow:0 10px 25px rgba(0,0,0,.10);
}
.kpi-title{
  font-size:12px;
  color:#666;
  margin-bottom:6px;
}
.kpi-value{
  font-size:28px;
  font-weight:800;
  color:#111;
}

/* セクション */
.section{
  padding:16px;
}
.section-title{
  font-size:18px;
  font-weight:700;
  margin-bottom:12px;
  color:#111;
}

/* 現場カード */
.site{
  background:#ffffff;
  border-radius:20px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 10px 25px rgba(0,0,0,.08);
  cursor:pointer;
  transition:transform .18s var(--ease);
}
.site:active{transform:scale(.98);}
.site-name{
  font-weight:700;
  font-size:15px;
  color:#111;
  margin-bottom:4px;
}
.site-count{
  font-size:26px;
  font-weight:800;
  color:#111;
}

/* ドライバー */
.driver{
  background:#ffffff;
  padding:14px;
  border-radius:16px;
  margin-bottom:10px;
  box-shadow:0 6px 18px rgba(0,0,0,.06);
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.driver-name{
  font-size:15px;
  font-weight:600;
  color:#111;
}
.status{
  font-size:12px;
  font-weight:700;
  padding:6px 12px;
  border-radius:999px;
}
.ok{background:#dcfce7;color:#166534;}
.warn{background:#fef3c7;color:#92400e;}
.off{background:#e0e7ff;color:#3730a3;}
</style>
</head>

<body>

<div class="header">管理ダッシュボード</div>

<div class="kpi">
  <div class="kpi-card">
    <div class="kpi-title">稼働中</div>
    <div class="kpi-value">8</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-title">未退勤</div>
    <div class="kpi-value">2</div>
  </div>
  <div class="kpi-card">
    <div class="kpi-title">前払い</div>
    <div class="kpi-value">¥240K</div>
  </div>
</div>

<div class="section">
  <div class="section-title">現場</div>

  <div class="site" onclick="selectSite('川口')">
    <div class="site-name">川口Amazon</div>
    <div class="site-count">5人</div>
  </div>

  <div class="site" onclick="selectSite('新宿')">
    <div class="site-name">新宿Amazon</div>
    <div class="site-count">3人</div>
  </div>
</div>

<div class="section">
  <div class="section-title" id="siteTitle">ドライバー</div>
  <div id="driverList"></div>
</div>

<script>
const data = {
  川口:[
    {name:"石塚",status:"ok"},
    {name:"田中",status:"warn"},
    {name:"佐藤",status:"off"}
  ],
  新宿:[
    {name:"小林",status:"ok"},
    {name:"鈴木",status:"warn"}
  ]
};

function selectSite(site){
  document.getElementById("siteTitle").innerText = site + " のドライバー";
  const list = document.getElementById("driverList");
  list.innerHTML = "";
  data[site].forEach(d => {
    const el = document.createElement("div");
    el.className = "driver";
    el.innerHTML = `
      <div class="driver-name">${d.name}</div>
      <div class="status ${d.status}">
        ${d.status==="ok"?"稼働中":d.status==="warn"?"未退勤":"休み"}
      </div>
    `;
    list.appendChild(el);
  });
}
</script>

</body>
</html>
